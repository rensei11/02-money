<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>金券・デジタルギフト 調査台帳 2026</title>
<style>
:root{
  --bg:#f4f6f8;--panel:#fff;--line:#d6dce2;--head:#20262d;--text:#1d2329;
  --muted:#606a74;--section:#e8edf2;--link:#0b57d0;--green:#18794e;--blue:#2f6fda;
  --red:#b42318;--yellow:#fff8df;--past:#f7f8f9;--low:#fafafa
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic UI","Meiryo",sans-serif;line-height:1.55}
.wrap{max-width:1320px;margin:0 auto;padding:18px}
.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
h1{font-size:22px;margin:0 0 4px}.meta{font-size:13px;color:var(--muted);margin:0 0 12px}.status{font-size:12px;color:var(--muted)}
.table-wrap{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:auto;box-shadow:0 1px 4px rgba(0,0,0,.04)}
table{width:100%;border-collapse:collapse;table-layout:fixed;min-width:900px}
col.date{width:16%}col.event{width:31%}col.benefit{width:34%}col.note{width:19%}
thead th{position:sticky;top:0;z-index:2;background:var(--head);color:#fff;text-align:left;font-size:14px;padding:10px 12px;border-right:1px solid #3d4650}
tbody td{vertical-align:top;padding:10px 12px;border-top:1px solid var(--line);border-right:1px solid var(--line);font-size:14px}
tbody td:last-child,thead th:last-child{border-right:0}.date-head{text-align:center}.date-cell{text-align:center;font-weight:700;white-space:normal;vertical-align:middle}
.section-row td{background:var(--section);font-weight:700;padding:7px 12px;border-top:2px solid #aeb8c2;color:#27313a}
.event-name{font-weight:700;font-size:15px}.event-name a{color:var(--link);text-decoration:none}.event-name a:hover{text-decoration:underline}.media{margin-top:2px;color:var(--muted);font-size:13px}
.benefit-lines>div+div{margin-top:2px}.format{font-weight:700}.gift{font-weight:700}.condition{color:#343b42}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:5px}.badge{display:inline-block;border-radius:999px;padding:2px 7px;font-size:11px;font-weight:700;background:#eef1f4;color:#49525b}.badge.replay{background:#eef4ff;color:#2458a6}.badge.pending{background:#fff1c2;color:#7a5600}.badge.recheck{background:#fff1c2;color:#7a5600}.badge.all{background:#e8f5ec;color:var(--green)}.badge.first{background:#eaf1ff;color:#2759b5}.badge.lottery{background:#fdecec;color:var(--red)}
.pending-row td:not(.date-cell){background:var(--yellow)}.past-row td{background:var(--past);color:#626970}.low-row td{background:var(--low);color:#71777d}
details{margin-top:3px}summary{cursor:pointer;color:var(--link);font-size:12px;user-select:none}.detail-box{margin-top:5px;padding:7px 8px;background:#f7f8fa;border:1px solid #e1e5e9;border-radius:6px;font-size:12px;color:#4a535c}.detail-line+.detail-line{margin-top:3px}.detail-label{font-weight:700;color:#333;margin-right:5px}
.loading{padding:28px;text-align:center;color:var(--muted)}.foot{font-size:12px;color:var(--muted);margin:9px 2px 0}
@media(max-width:700px){.wrap{padding:9px}h1{font-size:18px}table{min-width:820px}tbody td,thead th{padding:8px;font-size:13px}.event-name{font-size:14px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>金券・デジタルギフト 調査台帳 2026</h1>
      <p class="meta">全員付与・大規模先着・500円以上・オンライン完結を優先</p>
    </div>
    <div id="status" class="status">読み込み中…</div>
  </div>

  <div class="table-wrap">
    <table>
      <colgroup><col class="date"><col class="event"><col class="benefit"><col class="note"></colgroup>
      <thead>
        <tr>
          <th class="date-head">日付（または期間）</th>
          <th>イベント名</th>
          <th>特典 / 条件</th>
          <th>備考</th>
        </tr>
      </thead>
      <tbody id="ledgerBody"><tr><td colspan="4" class="loading">案件一覧を読み込んでいます…</td></tr></tbody>
    </table>
  </div>
  <p class="foot">※ 通常の案件追加・修正は「案件一覧.json」のみ更新します。細かい条件は「詳細」に格納しています。</p>
</div>
<script>
const tbody=document.getElementById('ledgerBody');
const status=document.getElementById('status');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const useful=v=>v!==undefined&&v!==null&&String(v).trim()!==''&&String(v).trim()!=='不明';

function dateLabel(value){
  if(!useful(value))return '不明';
  let s=String(value);
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)){
    const [y,m,d]=s.split('-').map(Number);const dt=new Date(y,m-1,d);const w=['日','月','火','水','木','金','土'][dt.getDay()];
    return `${m}/${d}（${w}）`;
  }
  s=s.replace(/(\d{4})-(\d{2})-(\d{2})/g,(_,y,m,d)=>`${Number(m)}/${Number(d)}`);
  s=s.replace(/(^|[・\s])(\d{2})-(\d{2})(?=$|[・\s])/g,(_,p,m,d)=>`${p}${Number(m)}/${Number(d)}`);
  s=s.replace(/2026-(\d{2})予定/g,(_,m)=>`${Number(m)}月予定`);
  return s;
}
function simpleFormat(v){
  const s=String(v||'不明');
  if(s.includes('オンライン')&&s.includes('オフライン'))return 'オンライン＋オフライン';
  if(s.includes('オンライン')||s.includes('オンデマンド')||s.includes('REPLAY')||s.includes('見逃し'))return 'オンライン';
  if(s.includes('オフライン')||s.includes('来場'))return 'オフライン';
  return s;
}
function shortGiftType(v){
  return String(v||'').replace('Amazonギフトカード','Amazon').replace('Amazonギフト','Amazon').replace('QUOカードPay','QUOカードPay');
}
function giftText(x){
  if(useful(x['特典']))return x['特典'];
  const type=x['特典種類']||'';const amount=x['特典額']||'';
  if(!useful(type)&&!useful(amount))return '不明';
  if(useful(amount)&&/(Amazon|QUO|Visa|giftee|PayPay)/i.test(amount))return amount;
  if(useful(type)&&useful(amount))return `${shortGiftType(type)} ${amount}`;
  if(useful(type))return `${shortGiftType(type)}（金額不明）`;
  return amount;
}
function modeText(x){return x['付与方式']||''}
function badgeClass(mode){if(mode==='全員')return'all';if(mode==='先着')return'first';if(mode==='抽選')return'lottery';return''}
function rowBadges(x,group){
  const out=[];const text=`${x['イベント名']||''} ${x['形式']||''}`;
  if(/REPLAY/i.test(text))out.push(['REPLAY','replay']);else if(/見逃し/.test(text))out.push(['見逃し','replay']);
  const mode=modeText(x);if(mode)out.push([mode,badgeClass(mode)]);
  if(group==='未受領ギフト')out.push(['未受領','pending']);
  const st=String(x['受付状況']||'');if(/要確認|要再確認|残枠不明|申込導線/.test(st))out.push(['要再確認','recheck']);
  if(useful(x['人数'])&&/先着/.test(x['人数']))out.push([x['人数'],'first']);
  return out;
}
function detailsHtml(x,group){
  const shown=new Set(['イベント名','媒体','開催日','形式','特典種類','特典額','特典','付与方式','必要条件','URL','id']);
  const order=['人数','受付状況','申込期限','所要時間','会社メール条件','SMS認証','付与時期','再確認日','状態','備考','理由'];
  const labels={'人数':'人数','受付状況':'受付','申込期限':'申込期限','所要時間':'所要時間','会社メール条件':'メール条件','SMS認証':'SMS認証','付与時期':'付与時期','再確認日':'再確認日','状態':'状態','備考':'補足','理由':'理由'};
  const lines=[];
  for(const key of order){if(shown.has(key)||!useful(x[key]))continue;lines.push(`<div class="detail-line"><span class="detail-label">${esc(labels[key]||key)}</span>${esc(x[key])}</div>`)}
  if(!lines.length)return '';
  return `<details><summary>詳細</summary><div class="detail-box">${lines.join('')}</div></details>`;
}
function renderEventCell(x){
  const name=esc(x['イベント名']||'名称不明');const url=x['URL'];
  const title=useful(url)?`<a href="${esc(url)}" target="_blank" rel="noopener">${name}</a>`:name;
  return `<div class="event-name">${title}</div><div class="media">${esc(x['媒体']||'媒体不明')}</div>`;
}
function renderBenefitCell(x){
  const mode=modeText(x);const gift=giftText(x);const giftMode=mode?`${esc(gift)}｜${esc(mode)}`:esc(gift);
  const cond=useful(x['必要条件'])?esc(x['必要条件']):'条件不明';
  return `<div class="benefit-lines"><div class="format">${esc(simpleFormat(x['形式']))}</div><div class="gift">${giftMode}</div><div class="condition">${cond}</div></div>`;
}
function renderNoteCell(x,group){
  const badges=rowBadges(x,group).map(([t,c])=>`<span class="badge ${esc(c)}">${esc(t)}</span>`).join('');
  return `<div class="badges">${badges}</div>${detailsHtml(x,group)}`;
}
function renderSection(title,items,groupClass){
  if(!items.length)return '';
  let html=`<tr class="section-row"><td colspan="4">${esc(title)}（${items.length}件）</td></tr>`;
  for(const x of items){
    html+=`<tr class="${groupClass}"><td class="date-cell">${esc(dateLabel(x['開催日']))}</td><td>${renderEventCell(x)}</td><td>${renderBenefitCell(x)}</td><td>${renderNoteCell(x,title)}</td></tr>`;
  }
  return html;
}
(async()=>{
  try{
    const r=await fetch(`案件一覧.json?v=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw new Error(`HTTP ${r.status}`);const data=await r.json();
    const current=data['現在受付中・要確認']||[],pending=data['未受領ギフト']||[],past=data['過去に確認済み']||[],low=data['対象外・低優先']||[];
    tbody.innerHTML=renderSection('現在受付中・要確認',current,'current-row')+renderSection('未受領ギフト',pending,'pending-row')+renderSection('過去に確認済み',past,'past-row')+renderSection('対象外・低優先',low,'low-row');
    status.textContent=`データ更新日：${data['更新日']||'不明'}　現在・要確認 ${current.length}件 / 未受領 ${pending.length}件`;
  }catch(e){tbody.innerHTML=`<tr><td colspan="4" class="loading">案件一覧.json の読み込みに失敗しました：${esc(e.message)}</td></tr>`;status.textContent='読み込み失敗';}
})();
</script>
</body>
</html>
