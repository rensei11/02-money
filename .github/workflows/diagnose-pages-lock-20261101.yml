name: Diagnose stuck Pages deployment 20261101
on:
  push:
    paths:
      - .github/workflows/diagnose-pages-lock-20261101.yml
permissions:
  contents: read
  deployments: read
  pages: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm the live site actually serves the corrected code
        run: |
          curl --fail --location --silent --show-error --retry 3 "https://rensei11.github.io/02-money/%E7%A2%BA%E8%AA%8D%E7%94%A8.html" -o "$RUNNER_TEMP/live.html"
          python3 -c 'import pathlib,os; s=pathlib.Path(os.environ["RUNNER_TEMP"],"live.html").read_text(encoding="utf-8"); assert "if(e.nightTime)detail+=" in s and "if(e.nightText)detail+=" in s and ".event-detail-text{white-space:pre-wrap;overflow-wrap:anywhere}" in s; print("LIVE_HTML_FIX_PRESENT")'
      - name: Find the old deployment and its status
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          echo "DEPLOYMENTS"
          gh api "repos/$GH_REPO/deployments?per_page=100" --jq '.[] | {id, sha, environment, created_at, updated_at}'
          echo "MATCHING_DEPLOYMENTS"
          gh api "repos/$GH_REPO/deployments?per_page=100" --jq '.[] | select(.sha == "c679219ae2a1a7fa670ed6ed241fa473cb9b7808") | {id, sha, environment, statuses_url}'
          gh api "repos/$GH_REPO/deployments/7470404029/statuses" --jq ".[] | {state,description}"
          echo "PAGES"
          gh api "repos/$GH_REPO/pages" --jq '{status, build_type, html_url, source}' || true
